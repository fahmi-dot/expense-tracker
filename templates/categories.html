{% extends "base.html" %}{% block content %}<h2>Kategori</h2><form method="POST"><input type="text" name="name" placeholder="Nama Kategori Baru" required><button type="submit">Tambah</button></form><ul style="margin-top:20px;">{% for c in categories %}<li><form action="{{ url_for('update_category', cid=c.id) }}" method="POST" style="display:inline"><input type="text" name="name" value="{{c.name}}"><button type="submit">Ubah</button></form> | <form action="{{ url_for('delete_category', cid=c.id) }}" method="POST" style="display:inline"><button type="submit" onclick="return confirm('Hapus?')">Hapus</button></form></li>{% endfor %}</ul>{% endblock %}
