{% extends "base.html" %}{% block content %}<h2>Ringkasan Harian ({{selected}})</h2><form><input type="date" name="date" value="{{selected}}"><button type="submit">Lihat</button></form><h3>Total: {{total|idr}}</h3><table border="1"><thead><tr><th>Kategori</th><th>Nominal</th><th>Keterangan</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.category}}</td><td>{{r.amount|idr}}</td><td>{{r.description}}</td></tr>{% else %}<tr><td colspan="3">Tidak ada transaksi</td></tr>{% endfor %}</tbody></table>{% endblock %}
