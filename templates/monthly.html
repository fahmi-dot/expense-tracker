{% extends "base.html" %}{% block content %}<h2>Ringkasan Bulanan ({{selected}})</h2><form><input type="month" name="month" value="{{selected}}"><button type="submit">Lihat</button></form><h3>Total: {{total|idr}}</h3><table border="1"><thead><tr><th>Kategori</th><th>Total</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.category}}</td><td>{{r.total|idr}}</td></tr>{% else %}<tr><td colspan="2">Tidak ada transaksi</td></tr>{% endfor %}</tbody></table><hr><h4>Ekspor CSV</h4><form action="{{ url_for('export_csv') }}"><input type="hidden" name="month" value="{{selected}}"><button type="submit">Unduh CSV Bulan Ini</button></form><form action="{{ url_for('export_csv') }}" style="margin-top:10px;">Rentang: <input type="date" name="date_from"> s/d <input type="date" name="date_to"><button type="submit">Unduh Rentang</button></form><a href="{{ url_for('export_csv') }}">Unduh Semua Data</a>{% endblock %}
